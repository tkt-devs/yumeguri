# Dependabot：部品の新しい版が出たら、更新の PR を自動で作る（S1-11）
# PR は CI を通してから、自分でマージする（自動ではマージしない）
# 出たばかりの版は、乗っ取られた版がまれに混ざるので、7日たってから更新する（cooldown）
# セキュリティの修正は、cooldown を待たずにすぐ PR になる
version: 2
updates:
  # Node（pnpm のワークスペース全体：apps/*・packages/*・いちばん上）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    # 大きな版（major）以外は、1つの PR にまとめる（PR が多すぎないように）
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Node は 24（LTS）で動かすと決めている（mise.toml）。型だけ新しい大きな版にすると、
    # Node 24 にない機能まで書けてしまうので、大きな版（24 → 25 など）の PR は作らない
    # Node の版を上げるときは、mise.toml・Dockerfile と一緒に手で上げる
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # Python（ワーカー）
  - package-ecosystem: uv
    directory: /services/worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions の部品（ci.yml の SHA とコメントの版を一緒に更新する）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Terraform の AWS プロバイダー（versions.tf の版と .terraform.lock.hcl を一緒に更新する）
  # Terraform 本体の版は Dependabot では上がらないので、mise.toml と versions.tf を手で上げる
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/envs/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      terraform:
        patterns: ['*']

  # docker-compose.yml のイメージ（postgres・valkey・LocalStack）
  # ci.yml の結合テストの postgres の版も、これに合わせて手で上げる
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Docker のベースのイメージ（node・python・uv）
  - package-ecosystem: docker
    directories: [/apps/api, /services/worker]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    # node のイメージも、大きな版の PR は作らない（上の @types/node と同じ理由。手元と本番で版がずれる）
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
